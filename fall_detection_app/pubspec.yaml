name: fall_detection_app
description: "Caregiver Mobile App for IoT-Based Motion & Fall Detection System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Cloud Services
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_database: ^11.0.0
  firebase_messaging: ^15.0.0

  # Local Notifications & Hardware Interactions
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.2.0

  # State Management & Utilities
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
